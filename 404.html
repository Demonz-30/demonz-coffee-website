<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Demonz Coffee</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0B0B0B" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon-32x32.png" />
  <link rel="stylesheet" href="css/fonts.css" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Poppins',sans-serif;background:#0B0B0B;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;overflow:hidden}
    .wrap{max-width:520px}
    .code{font-family:'Playfair Display',serif;font-size:clamp(5rem,20vw,9rem);font-weight:800;line-height:1;background:linear-gradient(135deg,#F5B041,#FF8C00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
    .title{font-family:'Montserrat',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#F5B041;font-size:.9rem;margin:8px 0 20px}
    p{color:rgba(255,255,255,.65);line-height:1.7;margin-bottom:30px}
    a.btn{display:inline-block;font-family:'Montserrat',sans-serif;background:linear-gradient(135deg,#F5B041,#FF8C00);color:#110a00;font-weight:600;padding:14px 34px;border-radius:50px;text-decoration:none;transition:transform .3s,box-shadow .3s}
    a.btn:hover{transform:translateY(-3px);box-shadow:0 14px 40px rgba(245,176,65,.45)}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <div class="title">Halaman Tidak Ditemukan</div>
    <p>Mohon maaf, halaman yang Anda cari tidak tersedia. Kopi premium Robusta Lampung masih menunggu Anda di beranda.</p>
